<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="1200" height="630" fill="#0F1923"/>

  <!-- Field grid lines horizontal -->
  <line x1="0" y1="80" x2="1200" y2="80" stroke="#1B3A6B" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="0" y1="160" x2="1200" y2="160" stroke="#1B3A6B" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="0" y1="240" x2="1200" y2="240" stroke="#1B3A6B" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="0" y1="320" x2="1200" y2="320" stroke="#1B3A6B" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="0" y1="400" x2="1200" y2="400" stroke="#1B3A6B" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="0" y1="480" x2="1200" y2="480" stroke="#1B3A6B" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="0" y1="560" x2="1200" y2="560" stroke="#1B3A6B" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Field grid lines vertical -->
  <line x1="80"  y1="0" x2="80"  y2="630" stroke="#1B3A6B" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="160" y1="0" x2="160" y2="630" stroke="#1B3A6B" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="240" y1="0" x2="240" y2="630" stroke="#1B3A6B" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="320" y1="0" x2="320" y2="630" stroke="#1B3A6B" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#1B3A6B" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="480" y1="0" x2="480" y2="630" stroke="#1B3A6B" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="560" y1="0" x2="560" y2="630" stroke="#1B3A6B" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="640" y1="0" x2="640" y2="630" stroke="#1B3A6B" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="720" y1="0" x2="720" y2="630" stroke="#1B3A6B" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#1B3A6B" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="880" y1="0" x2="880" y2="630" stroke="#1B3A6B" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="960" y1="0" x2="960" y2="630" stroke="#1B3A6B" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="1040" y1="0" x2="1040" y2="630" stroke="#1B3A6B" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="1120" y1="0" x2="1120" y2="630" stroke="#1B3A6B" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Radial glow -->
  <radialGradient id="glow" cx="50%" cy="45%" r="50%">
    <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo mark centered at 600,220 radius 90 -->
  <circle cx="600" cy="220" r="90" fill="#1B3A6B"/>
  <circle cx="600" cy="220" r="75" stroke="#FF6B35" stroke-width="2" stroke-opacity="0.25" fill="none"/>
  <circle cx="600" cy="220" r="52" stroke="#FF6B35" stroke-width="2" stroke-opacity="0.2" fill="none"/>

  <!-- f letterform rotated -20° around center 600,220 -->
  <g transform="rotate(-20, 600, 220)">
    <!-- top bar -->
    <rect x="576" y="188" width="45" height="9" rx="4.5" fill="#FF6B35"/>
    <!-- vertical stem -->
    <rect x="576" y="188" width="9" height="82" rx="4.5" fill="#FF6B35"/>
    <!-- mid bar -->
    <rect x="576" y="220" width="34" height="8" rx="4" fill="#FF6B35"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="120" font-weight="800" letter-spacing="10" fill="#FF6B35" text-anchor="middle">fircl</text>

  <!-- Tagline -->
  <text x="600" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500" letter-spacing="1" fill="#F7F3EE" text-anchor="middle">Your fan circle. Every game.</text>

  <!-- Divider -->
  <rect x="564" y="456" width="72" height="4" rx="2" fill="#FF6B35" opacity="0.6"/>

  <!-- Sub tagline -->
  <text x="600" y="502" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#F7F3EE" fill-opacity="0.5" text-anchor="middle">Private crew chats inside live game threads.</text>

  <!-- Coming soon badge -->
  <rect x="476" y="530" width="248" height="42" rx="21" fill="#FF6B35" fill-opacity="0.12" stroke="#FF6B35" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="510" cy="551" r="5" fill="#FF6B35"/>
  <text x="600" y="557" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#FF6B35" text-anchor="middle">COMING SOON</text>

  <!-- fircl.app url bottom right -->
  <text x="1160" y="606" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#F7F3EE" fill-opacity="0.3" text-anchor="end">fircl.app</text>

</svg>
